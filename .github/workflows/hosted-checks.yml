name: hosted-staging-checks

on:
  pull_request:
    paths:
      - ".github/workflows/hosted-checks.yml"
      - "frontend/**"
      - "hosted/**"
      - "zyvello_hosted/**"
      - "modal_zyvello_staging.py"
      - "tests/test_hosted_*.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  identity-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated hosted test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "PyJWT[crypto]>=2.9,<3"
      - name: Test hosted identity and workspace routes (no cloud credentials)
        run: python -m unittest discover -s tests -p 'test_hosted_*.py' -v

  hosted-frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exactly locked React dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile hosted preview (public placeholder URL only)
        env:
          VITE_ZYVELLO_HOSTED_MODE: "true"
          VITE_ZYVELLO_ENABLE_SIGNUP: "false"
          VITE_NEON_AUTH_URL: https://identity.example.test/neondb/auth
        run: npm run build:app
      - name: Validate isolated Hostinger private-beta build
        env:
          VITE_ZYVELLO_HOSTED_MODE: "true"
          VITE_ZYVELLO_ENABLE_SIGNUP: "false"
          VITE_NEON_AUTH_URL: https://staging-auth.neon.tech/neondb/auth
          VITE_ZYVELLO_API_URL: https://staging-api.us-east.modal.run
        run: npm run build:hosted

  postgres-rls-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Verify two-tenant RLS and safe job writes against disposable PostgreSQL
        env:
          TEST_POSTGRES_URL: postgresql://postgres:ci-local-only@localhost:5432/postgres
          TEST_POSTGRES_API_URL: postgresql://zyvello_api_staging:ci-local-only@localhost:5432/postgres
          TEST_POSTGRES_WORKER_URL: postgresql://zyvello_worker_staging:ci-local-only@localhost:5432/postgres
        run: python hosted/ci/rls_integration.py
      - name: Verify free, paid, cancelled and expired access at database layer
        env:
          TEST_POSTGRES_URL: postgresql://postgres:ci-local-only@localhost:5432/postgres
          TEST_POSTGRES_API_URL: postgresql://zyvello_api_staging:ci-local-only@localhost:5432/postgres
          TEST_POSTGRES_WORKER_URL: postgresql://zyvello_worker_staging:ci-local-only@localhost:5432/postgres
        run: python hosted/ci/rls_paid_gates.py
